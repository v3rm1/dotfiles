name: lint

on:
  push:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  bootstrap-dry-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [container, uni-server]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y stow
      - run: ./bootstrap.sh ${{ matrix.machine }} --dry-run
