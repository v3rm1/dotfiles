# Noctalia v5 shell config (hand-written layer).
# GUI changes land in ~/.local/state/noctalia/settings.toml and override this file;
# port anything worth keeping back here. Check with `noctalia config validate`.

[theme]
mode = "dark"
source = "custom"
custom_palette = "tokyonight-night"

[shell]
font_family = "InputMono Nerd Font"
corner_radius_scale = 0.7
time_format = "{:%H:%M}"
setup_wizard_enabled = false
polkit_agent = true

# Liquid glass meets cyberpunk: frosted translucent surfaces (niri blur, see theme.kdl),
# soft corners, neon cyan/magenta rims. Panel borders use the palette outline.
[shell.panel]
transparency_mode = "glass"

[shell.shadow]
alpha = 0.8

[shell.launcher]
app_grid = true
sort_by_usage = true

# Global UI size (panels, launcher, settings window); does not affect the bar (own scale).
[accessibility]
ui_scale = 1.2

[location]
auto_locate = false
address = "Grimstad, Norway"
latitude = 58.3413
longitude = 8.5934

[weather]
enabled = true
unit = "metric"

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/Pictures/Wallpapers"

[wallpaper.default]
path = "~/Pictures/Wallpapers/ascii-cat.png"

[backdrop]
enabled = false

[dock]
enabled = false

[notification]
border_color = "primary"
border_width = 1.5

[osd]
border_color = "secondary"
border_width = 1.5

[bar]
order = ["main"]

[bar.main]
# Cyberpunk 2077 HUD strip: flush to the top edge, full width, square corners,
# translucent with a neon rim (Noctalia draws the border on all four sides).
# No capsules; groups are split by "//" text widgets. Font is Rajdhani
# (dotfiles fonts package).
position = "top"
thickness = 40
margin_edge = 0
margin_ends = 0
radius = 0
concave_edge_corners = false
background_opacity = 0.55
compositor_blur = true
border = "primary"
border_width = 1.5
shadow = true
font_family = "Rajdhani"
font_weight = 600
font_scale = 1.15
scale = 1.3
color = "primary"
icon_color = "primary"
capsule = false
widget_spacing = 12
start = ["workspaces"]
center = ["media"]
end = ["privacy", "tray", "network", "bluetooth", "volume", "sep_stats", "cpu", "ram", "temp", "sep_weather", "weather", "sep_clock", "clock", "control-center"]

[widget.sep_stats]
type = "text"
text = "//"

[widget.sep_weather]
type = "text"
text = "//"

[widget.sep_clock]
type = "text"
text = "//"

[widget.workspaces]
style = "focus_hint"
show_icons = true
focused_color = "primary"
occupied_color = "secondary"
empty_color = "outline"

[widget.privacy]
hide_inactive = true
active_color = "secondary"

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.taskbar]
active_indicator_color = "secondary"
icon_scale = 1.3

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.weather]
show_condition = false

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"

[widget.ram]
type = "sysmon"
stat = "ram_used"
visualization = "none"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"

[widget.clock]
color = "secondary"
icon_color = "secondary"
capsule_border = "secondary"

[widget.control-center]
icon_color = "secondary"

[desktop_widgets]
enabled = true
widget_order = ["visualizer_main"]

# Neon circular spectrum in the top-right corner; fades out when no audio plays.
[desktop_widgets.widget.visualizer_main]
type = "fancy_audio_visualizer"
output = "DP-1"
cx = 2320.0
cy = 300.0
box_width = 440.0
box_height = 440.0
rotation = 0.0

[desktop_widgets.widget.visualizer_main.settings]
visualization_mode = "bars_rings"
sensitivity = 1.5
rotation_speed = 0.4
bloom_intensity = 0.8
fade_when_idle = true
primary_color = "primary"
secondary_color = "secondary"

# Lock screen: blurred desktop behind a translucent neon login bar, big clock, weather.
[lockscreen]
blurred_desktop = true
# Short fade on lock and unlock. ("pixel" is documented upstream but not
# supported by noctalia 5.3.0.)
transition = ["fade"]
transition_duration = 600
blur_intensity = 0.8
tint_intensity = 0.35

[lockscreen_widgets]
enabled = true
schema_version = 2
# Back to front. Layout for DP-1 at 2560x1440: corner shapes, a tilted card
# holding clock/date/volume/CPU, a visualiser above the login box.
widget_order = [
  "shape_tl_square",
  "shape_tl_circle",
  "shape_tl_badge",
  "shape_tr_square",
  "shape_tr_small",
  "shape_tr_circle",
  "card_back",
  "card_front",
  "locked_label",
  "lock_clock",
  "lock_date",
  "lock_volume",
  "lock_sysmon",
  "lock_visualizer",
  "lockscreen-login-box@DP-1",
]

[lockscreen_widgets.widget.shape_tl_square]
type = "sticker"
output = "DP-1"
cx = 107.0
cy = 140.0
box_width = 140.0
box_height = 140.0
rotation = 0.25

[lockscreen_widgets.widget.shape_tl_square.settings]
image_path = "/home/v3rm1/.config/noctalia/lockscreen/square-slate.svg"
opacity = 0.9
background = false

[lockscreen_widgets.widget.shape_tl_circle]
type = "sticker"
output = "DP-1"
cx = 353.0
cy = 100.0
box_width = 75.0
box_height = 75.0
rotation = 0.0

[lockscreen_widgets.widget.shape_tl_circle.settings]
image_path = "/home/v3rm1/.config/noctalia/lockscreen/circle-navy.svg"
opacity = 1.0
background = false

[lockscreen_widgets.widget.shape_tl_badge]
type = "sticker"
output = "DP-1"
cx = 300.0
cy = 350.0
box_width = 280.0
box_height = 280.0
rotation = 0.15

[lockscreen_widgets.widget.shape_tl_badge.settings]
image_path = "/home/v3rm1/.config/noctalia/lockscreen/badge-ink.svg"
opacity = 0.95
background = false

[lockscreen_widgets.widget.shape_tr_square]
type = "sticker"
output = "DP-1"
cx = 2373.0
cy = 160.0
box_width = 160.0
box_height = 160.0
rotation = 0.45

[lockscreen_widgets.widget.shape_tr_square.settings]
image_path = "/home/v3rm1/.config/noctalia/lockscreen/square-purple.svg"
opacity = 0.45
background = false

[lockscreen_widgets.widget.shape_tr_small]
type = "sticker"
output = "DP-1"
cx = 2173.0
cy = 210.0
box_width = 90.0
box_height = 90.0
rotation = -0.2

[lockscreen_widgets.widget.shape_tr_small.settings]
image_path = "/home/v3rm1/.config/noctalia/lockscreen/square-night.svg"
opacity = 1.0
background = false

[lockscreen_widgets.widget.shape_tr_circle]
type = "sticker"
output = "DP-1"
cx = 2387.0
cy = 355.0
box_width = 75.0
box_height = 75.0
rotation = 0.0

[lockscreen_widgets.widget.shape_tr_circle.settings]
image_path = "/home/v3rm1/.config/noctalia/lockscreen/circle-blue.svg"
opacity = 0.9
background = false

# Tilted backing card behind the main card (empty labels used as panels).
[lockscreen_widgets.widget.card_back]
type = "label"
output = "DP-1"
cx = 1280.0
cy = 640.0
box_width = 640.0
box_height = 500.0
rotation = -0.1

[lockscreen_widgets.widget.card_back.settings]
title = ""
background_color = "surface_variant"
background_opacity = 0.55
background_radius = 24.0
shadow = false

[lockscreen_widgets.widget.card_front]
type = "label"
output = "DP-1"
cx = 1280.0
cy = 630.0
box_width = 620.0
box_height = 480.0

[lockscreen_widgets.widget.card_front.settings]
title = ""
background_color = "surface"
background_opacity = 0.85
background_radius = 24.0
shadow = false

[lockscreen_widgets.widget.locked_label]
type = "label"
output = "DP-1"
cx = 1280.0
cy = 325.0

[lockscreen_widgets.widget.locked_label.settings]
font_family = "Rajdhani SemiBold"
title = "L  O  C  K  E  D"
color = "primary"
background = false
shadow = true

[lockscreen_widgets.widget.lock_clock]
type = "clock"
output = "DP-1"
cx = 1280.0
cy = 500.0
box_width = 560.0
box_height = 200.0

[lockscreen_widgets.widget.lock_clock.settings]
font_family = "Rajdhani Bold"
clock_style = "digital"
format = "{:%H:%M}"
center_text = true
color = "on_surface"
background = false
shadow = true

[lockscreen_widgets.widget.lock_date]
type = "clock"
output = "DP-1"
cx = 1280.0
cy = 625.0
box_width = 420.0
box_height = 50.0

[lockscreen_widgets.widget.lock_date.settings]
font_family = "Rajdhani SemiBold"
clock_style = "digital"
format = "{:%a, %b %d}"
center_text = true
color = "primary"
background = false
shadow = false

[lockscreen_widgets.widget.lock_volume]
type = "volume"
output = "DP-1"
cx = 1140.0
cy = 770.0
box_width = 270.0
box_height = 140.0

[lockscreen_widgets.widget.lock_volume.settings]
device = "output"
fill_color = "primary"
background_color = "surface_variant"
background_opacity = 0.9
background_radius = 14.0

[lockscreen_widgets.widget.lock_sysmon]
type = "sysmon"
output = "DP-1"
cx = 1420.0
cy = 770.0
box_width = 270.0
box_height = 140.0

[lockscreen_widgets.widget.lock_sysmon.settings]
display = "graph"
stat = "cpu_usage"
stat2 = "cpu_temp"
color = "primary"
color2 = "secondary"
background_color = "surface_variant"
background_opacity = 0.9
background_radius = 14.0

[lockscreen_widgets.widget.lock_visualizer]
type = "audio_visualizer"
output = "DP-1"
cx = 1280.0
cy = 1050.0
box_width = 1080.0
box_height = 180.0

[lockscreen_widgets.widget.lock_visualizer.settings]
bands = 64
mirrored = true
centered = true
show_when_idle = false
color_1 = "tertiary"
color_2 = "primary"
background = false

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
type = "login_box"
output = "DP-1"
cx = 1280.0
cy = 1250.0

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
layout = "regular"
show_weather = true
show_media = true
background_color = "surface"
background_opacity = 0.75
background_radius = 16.0
input_opacity = 0.6
input_radius = 10.0
center_password_text = true

[plugins]
enabled = ["v3rm1/command_runner", "v3rm1/file_search"]
auto_update = "official"

# Personal plugins live in the dotfiles repo and are loaded read-only from there.
[[plugins.source]]
name = "dotfiles"
kind = "path"
location = "~/dotfiles/noctalia/plugins"
enabled = true

# Control-centre tiles: defaults with caffeine swapped for the WireGuard VPN
# toggle (local plugin v3rm1/wireguard).
[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "v3rm1/wireguard:toggle"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"
