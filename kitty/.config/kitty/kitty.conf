# Font settings
font_family      InputMono Nerd Font
bold_font        InputMono Nerd Font Bold
italic_font      InputMono Nerd Font Italic
bold_italic_font InputMono Nerd Font Bold Italic
font_size 15.0

# Theme settings
include themes/tokyonight-night.conf
background_opacity 1.0

# Cursor settings
cursor_shape underline
cursor_blink_interval 0

# Shell integration (sudo terminfo and title on by default; keep our cursor shape)
shell_integration enabled no-cursor

# tmux handles splits/windows — kitty is just the container
mouse_hide_wait -1
scrollback_lines 10000
confirm_os_window_close -1

# macOS
macos_titlebar_color background
macos_option_as_alt left
