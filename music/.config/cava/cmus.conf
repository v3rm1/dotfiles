; cava profile for the cmus music workspace (started by ~/.local/bin/music-launch).
; Pixel-exact SDL window: 4 px bars with 1 px gaps, mirrored about a centre
; line by shaders/mirror_bars.frag, Tokyo Night gradient bass to treble.
; The shader holds at most 512 bars (a larger uniform array fails to link),
; so bar_width + bar_spacing must be >= window width / 512: 5 px for a
; full-width window on a 2560 px screen.
[general]
framerate = 60
bar_width = 4
bar_spacing = 1
; Stop redrawing after 3 s of silence.
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = sdl_glsl
vertex_shader = pass_through.vert
fragment_shader = mirror_bars.frag
channels = mono

[color]
background = '#1a1b26'
gradient = 1
gradient_color_1 = '#bb9af7'
gradient_color_2 = '#7aa2f7'
gradient_color_3 = '#7dcfff'

[smoothing]
monstercat = 1
noise_reduction = 77
