# Enable with `pre-commit install`; run on everything with `pre-commit run -a`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # shellcheck has no zsh support
        exclude: ^zsh/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
  - repo: local
    hooks:
      - id: check-packages
        name: every stow package is in a machine profile
        entry: machines/check-packages.sh
        language: script
        pass_filenames: false
        always_run: true
